name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Normalize gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build plugin
        run: ./gradlew HGhubProvider:make --no-daemon

      - name: Show outputs
        if: always()
        run: find . -name "*.cs3" -o -name "*.apk" | grep -v gradle-wrapper || true

      - uses: actions/upload-artifact@v4
        with:
          name: HGhubProvider-plugin
          path: |
            **/*.cs3
            **/*.apk
          if-no-files-found: warn