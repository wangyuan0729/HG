name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew HGhubProvider:make --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhubProvider-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
